name: autopost

on:
  schedule:
    # JST 04:00〜23:00 の毎時（UTC表記）。1回起動すれば中で見張り続けるので、起動が遅れても平気
    - cron: "0 0-14,19-23 * * *"
  repository_dispatch:
    types: [tick]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1=投稿せず鍵チェックだけ / 0=本番"
        default: "1"
      watch:
        description: "1=見張りモードで今すぐ開始 / 0=1回だけ実行"
        default: "0"

permissions:
  contents: write

concurrency:
  # 見張り役は常に1つだけ。1回だけの手動実行は別枠なのですぐ動く
  group: autopost-${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.watch != '1') && 'manual' || 'watch' }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: watch and post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          EVENT_NAME: ${{ github.event_name }}
          WATCH_INPUT: ${{ github.event.inputs.watch || '0' }}
        run: |
          git config user.name  "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"

          WATCH_MIN=345   # 自動起動なら最長5時間45分ぶん見張る
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$WATCH_INPUT" != "1" ]; then
            WATCH_MIN=0   # 手動の「1回だけ実行」
          fi

          NOW=$(date +%s)
          END=$(( NOW + WATCH_MIN * 60 ))
          NIGHT=$(TZ=Asia/Tokyo date -d "today 23:10" +%s)   # 深夜は見張らない
          if [ "$END" -gt "$NIGHT" ]; then END=$NIGHT; fi

          LOCAL=/tmp/posted_local.json
          cp posted.json "$LOCAL" 2>/dev/null || echo '{}' > "$LOCAL"

          while : ; do
            echo "--- tick $(TZ=Asia/Tokyo date '+%m/%d %H:%M JST') ---"

            # 1) GitHub上の最新（予定表と記録）にそろえ、手元の記録と「合体」する
            #    どちらかに投稿済みの記録があれば投稿済みとして残る＝記録が消えて二重投稿になるのを防ぐ
            git fetch origin main -q || true
            git reset -q --hard origin/main || true
            python merge_posted.py "$LOCAL" posted.json

            # 2) 予定の時刻を過ぎた投稿を出す
            python post.py || echo "post.py returned non-zero (continue)"
            cp posted.json "$LOCAL"

            # 3) 記録だけを保存。ぶつかったら合体し直して3回までやり直す
            for try in 1 2 3; do
              git add posted.json
              if git diff --cached --quiet; then break; fi
              git commit -q -m "chore: record posted items"
              if git push -q; then echo "記録を保存しました"; break; fi
              echo "保存がぶつかりました → 合体してやり直し ($try)"
              git fetch origin main -q || true
              git reset -q --hard origin/main || true
              python merge_posted.py "$LOCAL" posted.json
            done

            [ "$(date +%s)" -ge "$END" ] && break
            sleep 180                       # 3分おきに確認
          done
          echo "watch finished"
