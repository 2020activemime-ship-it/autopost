name: autopost

on:
  schedule:
    - cron: "*/15 * * * *"   # 15分ごと（UTC基準。post.py側でJST判定）
  workflow_dispatch:          # 手動実行ボタン
    inputs:
      dry_run:
        description: "1=投稿せず鍵チェックだけ / 0=本番"
        default: "1"

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: post due items
        run: python post.py
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
      - name: save posted state
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || git commit -m "chore: record posted items"
          git push
