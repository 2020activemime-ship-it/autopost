name: comments

on:
  schedule:
    - cron: "15 */2 * * *"   # 2時間おき（JSTでも2時間おき）
  push:
    paths:
      - replies_out.json
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1=件数だけ表示 / 0=本番"
        default: "0"

permissions:
  contents: write

concurrency:
  group: comments
  cancel-in-progress: false

jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: fetch comments and send queued replies
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: |
          python send_replies.py || true
          python fetch_comments.py || true
          git config user.name  "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          for f in comments.json replied.json replies_out.json; do [ -f "$f" ] && git add "$f"; done
          if ! git diff --cached --quiet; then
            git commit -q -m "chore: update comments"
            for try in 1 2 3; do git pull -q --rebase && git push -q && break; done
          fi
